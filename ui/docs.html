<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="docboard-version" content="0.5.0">
<title>Docs</title>
<link rel="stylesheet" href="../__picode/tokens.css">
<style>
  :root {
    --bg-base: var(--pc-bg);
    --bg-panel: var(--pc-panel);
    --bg-elevated: var(--pc-elevated);
    --border: var(--pc-border);
    --border-strong: var(--pc-border-strong);
    --control-line: var(--pc-border-strong);
    --text-primary: var(--pc-text);
    --text-secondary: var(--pc-text-muted);
    --accent: var(--pc-accent);
    --accent-fill: var(--pc-accent-fill);
    --on-accent: var(--pc-on-accent);
    --ok: var(--pc-ok);
    --warn: var(--pc-warn);
    --danger: var(--pc-danger);
    --accent-soft: color-mix(in srgb, var(--pc-accent) 16%, transparent);
    --radius-ctl: var(--pc-radius);
    --radius-panel: var(--pc-radius-panel);
    --radius-pill: 999px;
    --ctl-h: var(--pc-ctl-h);
    --font-sans: var(--pc-font);
    --mono: var(--pc-font-code);
    --code: var(--pc-font-code);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--bg-base); color: var(--text-primary);
    font-family: var(--font-sans), system-ui, sans-serif;
    font-size: 13px; line-height: 1.5;
  }
  .app { height: 100%; display: flex; min-height: 0; }

  .rail { width: 192px; flex: none; border-right: 1px solid var(--border); padding: 12px 9px 10px; display: flex; flex-direction: column; gap: 1px; background: var(--bg-panel); overflow-y: auto; }
  .rail-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--text-secondary); font-size: 12.5px; text-align: left; cursor: pointer; font-family: inherit; }
  .rail-item:hover { background: var(--bg-base); color: var(--text-primary); }
  .rail-item[aria-current="page"] { background: var(--accent-soft); color: var(--text-primary); font-weight: 600; }
  .rail-item .cnt { margin-left: auto; font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .rail-group { margin: 14px 10px 4px; font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--text-secondary); font-weight: 650; }
  .rail-foot { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-secondary); line-height: 1.45; overflow-wrap: anywhere; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex: none; min-height: 58px; }
  .tb-left { min-width: 0; flex: 1; }
  .tb-title { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-sub { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-search { width: 300px; max-width: 42%; display: flex; align-items: center; gap: 8px; background: var(--bg-base); border: 1px solid var(--control-line); border-radius: 8px; padding: 0 9px; height: var(--ctl-h); flex: none; }
  .tb-search:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tb-search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text-primary); font-size: 13px; height: calc(var(--ctl-h) - 2px); outline: 0; font-family: inherit; }
  .tb-actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .kbd { font-family: var(--mono), monospace; font-size: 10.5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg-panel); color: var(--text-secondary); }

  .content { flex: 1; overflow: auto; padding: 18px 18px 26px; }
  .content:focus { outline: none; }

  .plain-h { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--text-secondary); font-weight: 650; margin: 0 0 8px; }
  .section-gap { margin-top: 22px; }
  .meta { font-size: 11.5px; color: var(--text-secondary); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  p { margin: 7px 0; font-size: 13px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono), monospace; font-size: .92em; }
  code { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 12.5px; }
  th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-secondary); font-weight: 650; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  ul, ol { margin: 6px 0 12px; padding-left: 18px; }
  li { margin: 3px 0; font-size: 13px; }

  .btn { font-size: 12.5px; border: 1px solid var(--border); background: var(--bg-base); color: var(--text-primary); border-radius: 8px; height: var(--ctl-h); padding: 0 12px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
  .btn:hover { border-color: var(--border-strong); }
  .btn.primary { border-color: var(--accent-fill); background: var(--accent-fill); color: var(--on-accent); font-weight: 600; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { height: 28px; font-size: 11.5px; padding: 0 9px; border-radius: 7px; }
  .linkbtn { border: 0; background: transparent; color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 0; font-family: inherit; }
  .linkbtn:hover { text-decoration: underline; }

  .seg { display: inline-flex; gap: 2px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--text-secondary); font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--bg-elevated); color: var(--text-primary); font-weight: 600; }

  .field { height: var(--ctl-h); border: 1px solid var(--control-line); border-radius: 8px; background: var(--bg-base); color: var(--text-primary); padding: 0 10px; font-size: 13px; width: 100%; font-family: inherit; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .fieldwrap { display: flex; align-items: center; gap: 8px; background: var(--bg-base); border: 1px solid var(--control-line); border-radius: 8px; padding: 0 10px; height: var(--ctl-h); }
  .fieldwrap:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
  .fieldwrap input { border: 0; outline: 0; background: transparent; color: var(--text-primary); height: calc(var(--ctl-h) - 2px); flex: 1; font-size: 13px; font-family: inherit; min-width: 0; }

  .tag { font-size: 10.5px; border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 1px 7px; color: var(--text-secondary); white-space: nowrap; }
  .tag.owner { border-color: var(--warn); color: var(--warn); }
  .tag.cost { border-color: var(--accent); color: var(--accent); }
  .tag.danger { border-color: var(--danger); color: var(--danger); }
  .tag.ok { border-color: var(--ok); color: var(--text-primary); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--text-secondary); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); } .dot.run { background: var(--accent); }

  .coll-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; }
  .coll { text-align: left; background: var(--bg-base); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; cursor: pointer; color: var(--text-primary); font-family: inherit; }
  .coll:hover { border-color: var(--border-strong); }
  .coll b { display: block; font-size: 13px; font-weight: 600; }
  .coll .n { font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .filelist { display: flex; flex-direction: column; gap: 1px; }
  .file { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; color: var(--text-primary); font-size: 12.5px; font-family: inherit; }
  .file:hover { background: var(--bg-base); }
  .file[aria-current="true"] { background: var(--accent-soft); }
  .file .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .d { font-size: 11px; color: var(--text-secondary); white-space: nowrap; }

  .readgrid { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 20px; align-items: start; }
  .readgrid aside { min-width: 0; border-right: 1px solid var(--border); padding-right: 14px; }
  .listhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .listhead b { font-size: 12.5px; font-weight: 650; }
  .listhead .meta { margin-left: auto; }
  .crumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-secondary); margin-bottom: 8px; }
  .crumb .sep { opacity: .55; }
  .doc-title { font-size: 18px; line-height: 1.25; font-weight: 650; margin: 2px 0 3px; letter-spacing: -.01em; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }

  .reader { font-size: 13.5px; max-width: 74ch; line-height: 1.62; }
  .reader h2, .reader h3 { font-size: 15px; margin: 20px 0 6px; font-weight: 650; letter-spacing: -.005em; }
  .reader h4 { font-size: 13.8px; margin: 16px 0 5px; font-weight: 650; }
  .reader h5 { font-size: 13px; margin: 14px 0 4px; font-weight: 650; }
  .reader p, .reader li { font-size: 13.5px; }
  .reader pre { background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: 11.5px; line-height: 1.5; }
  .reader pre code { border: 0; background: transparent; padding: 0; }
  .reader blockquote { margin: 8px 0; padding-left: 10px; border-left: 2px solid var(--border-strong); color: var(--text-secondary); }
  .reader table { font-size: 12.3px; }
  .reader hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .flash { animation: flash 4s ease-out; }
  @keyframes flash { 0%, 45% { background: var(--accent-soft); } 100% { background: transparent; } }

  .results { display: flex; flex-direction: column; }
  .result { display: flex; gap: 12px; align-items: baseline; padding: 9px 8px; border-bottom: 1px solid var(--border); cursor: pointer; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--text-primary); font-family: inherit; }
  .result:hover { background: var(--bg-base); }
  .result .body { flex: 1; min-width: 0; }
  .result .path { font-weight: 600; font-size: 13px; }
  .result .where { font-size: 11px; color: var(--text-secondary); }
  .result .snip { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .result mark { background: transparent; color: var(--accent); font-weight: 600; }
  .result .go { font-size: 11.5px; color: var(--accent); white-space: nowrap; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .kpi { background: var(--bg-base); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; text-align: left; color: var(--text-primary); font-family: inherit; }
  button.kpi { cursor: pointer; }
  button.kpi:hover { border-color: var(--border-strong); }
  .kpi .v { font-size: 21px; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .kpi .c { font-size: 10.5px; color: var(--text-secondary); margin-top: 5px; }

  .gates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .gate { display: flex; align-items: center; gap: 9px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; font-size: 12.5px; }
  .gate .grow { flex: 1; min-width: 0; }
  .gate .why { font-size: 11px; color: var(--text-secondary); }

  .cmdgroup { margin: 16px 0 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-secondary); font-weight: 650; }
  .cmd { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .cmd .grow { flex: 1; min-width: 220px; }
  .cmd b { font-size: 12.8px; font-weight: 600; }
  .cmd .when { font-size: 11.5px; color: var(--text-secondary); }
  .cmd .right { display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 10.5px; color: var(--text-secondary); }

  .run { display: flex; align-items: center; gap: 10px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; margin-bottom: 6px; font-size: 12.5px; }
  .run.running { border-color: var(--accent); }
  .run .grow { flex: 1; min-width: 0; }
  .run .sub { font-size: 11px; color: var(--text-secondary); }
  .run .phase { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
  .progress { height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; }

  .graphwrap { height: clamp(260px, 42vh, 430px); border: 1px solid var(--border); border-radius: 10px; background: var(--bg-base); overflow: hidden; position: relative; }
  .graphwrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .graphwrap svg:active { cursor: grabbing; }
  .gedge { stroke: var(--border-strong); stroke-opacity: .8; }
  .gedge-arrow { fill: var(--border-strong); }
  .gnode { fill: var(--text-secondary); stroke: var(--bg-base); stroke-width: 1.5; cursor: pointer; }
  .gnode.current { fill: var(--accent); }
  .gnode.collection { fill: var(--accent-soft); stroke: var(--accent); }
  .glabel { fill: var(--text-secondary); font-size: 10.5px; pointer-events: none; }
  .glabel.current { fill: var(--text-primary); font-weight: 600; }
  .graphlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px; }
  .graphlist button { display: flex; align-items: baseline; gap: 8px; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; color: var(--text-primary); font-size: 12px; font-family: inherit; min-width: 0; }
  .graphlist button:hover { background: var(--bg-base); }
  .graphlist .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .graphlist .d { font-size: 10.5px; color: var(--text-secondary); white-space: nowrap; }
  .covarea { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; flex-wrap: wrap; }
  .covarea .name { font-weight: 600; min-width: 140px; }
  .covarea .grow { flex: 1; min-width: 160px; }
  .covarea .docs { display: flex; gap: 4px; flex-wrap: wrap; }
  .obligation { border-bottom: 1px solid var(--border); padding: 9px 2px; }
  .obligation .head { display: flex; align-items: flex-start; gap: 8px; }
  .obligation .grow { flex: 1; min-width: 0; }
  .obligation .ttl { font-size: 12.8px; font-weight: 600; }
  .obligation .why { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .obligation .ev { font-size: 10.5px; color: var(--text-secondary); margin-top: 3px; overflow-wrap: anywhere; }
  .obligation .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .pulsecommit { display: flex; align-items: flex-start; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .pulsecommit .grow { flex: 1; min-width: 0; }
  .pulsecommit .hash { font-family: var(--mono); font-size: 10.5px; color: var(--text-secondary); }
  .pulsecommit .files { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .pulsecommit .f { font-size: 10.5px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-base); padding: 1px 6px; cursor: pointer; color: var(--text-secondary); font-family: inherit; }
  .pulsecommit .f:hover { color: var(--text-primary); }
  .openrow { display: flex; align-items: flex-start; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border); }
  .openrow .grow { flex: 1; min-width: 0; }
  .openrow .txt { font-size: 12.8px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .alertrow { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .alertrow:last-child { border-bottom: 0; }
  .alertrow .grow { flex: 1; }

  .empty { border: 1px dashed var(--border); border-radius: 10px; padding: 18px; }
  .empty b { display: block; font-size: 13px; margin-bottom: 3px; }
  .empty p { margin: 0 0 10px; color: var(--text-secondary); font-size: 12px; }
  .boot { height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .boot .box { max-width: 440px; }
  .sk { height: 10px; border-radius: 5px; background: var(--bg-base); border: 1px solid var(--border); margin: 7px 0; }

  .overlay { position: absolute; inset: 0; background: color-mix(in srgb, #000 42%, transparent); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 40; }
  .overlay.open { display: flex; }
  .dialog { width: min(500px, 100%); max-height: 88%; overflow: auto; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-panel); padding: 16px 18px; }
  .dialog h3 { margin: 0 0 4px; font-size: 15px; }
  .dialog .sub { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; }
  .dialog .pre { background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12px; margin: 10px 0; }
  .dialog .pre div { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .dialog .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .dialog .err { color: var(--danger); font-size: 11.5px; margin-top: 4px; }
  .dialog pre.log { margin: 0; max-height: 46vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 11px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .radio { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px; min-height: var(--ctl-h); }
  .radio:hover { background: var(--bg-base); }
  .radio input { accent-color: var(--accent-fill); }

  .toasts { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: 320px; }
  .toast { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font-size: 12px; }

  @media (max-width: 980px) {
    .readgrid { grid-template-columns: 1fr; }
    .readgrid aside { display: none; }
  }
  @media (max-width: 820px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .gates { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .rail { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 6px 8px; gap: 2px; }
    .rail-group, .rail-foot { display: none; }
    .rail-item { width: auto; flex: none; }
    .toolbar { flex-wrap: wrap; min-height: 0; padding: 10px 12px; gap: 10px; }
    .tb-left { flex-basis: 100%; }
    .tb-search { order: 3; flex-basis: 100%; width: auto; max-width: none; }
    .content { padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flash { animation: none; background: var(--accent-soft); }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Visões do Docboard"></nav>
  <div class="main">
    <div class="toolbar">
      <div class="tb-left">
        <div class="tb-title" id="tb-title">Docs</div>
        <div class="tb-sub" id="tb-sub"></div>
      </div>
      <div class="tb-search">
        <input id="global-search" type="search" placeholder="Buscar nas docs…" aria-label="Buscar nas docs" autocomplete="off" spellcheck="false" />
        <span class="kbd">⌘K</span>
      </div>
      <div class="tb-actions" id="tb-actions"></div>
    </div>
    <div class="content" id="content" tabindex="-1"></div>
  </div>
</div>
<div class="overlay" id="overlay" role="presentation">
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="../_picode/lib/d3.js"></script>
<script src="app.js"></script>
</body>
</html>
